<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Lab</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2024; --muted:#68707a; --line:#e2e5e9;
          --accent:#2457d6; --ok:#1f8a4c; --warn:#b26a00; --none:#8a929b; --llm:#7b3fc4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111316; --panel:#1a1d21; --text:#e6e8eb; --muted:#9aa2ab; --line:#2a2f35;
            --accent:#6f9bff; --ok:#4cc27e; --warn:#e3a33a; --none:#6c747d; --llm:#b38cff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  header span { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 300px; gap:16px; padding:16px; max-width:1200px; margin:0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0,1fr); } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
  input[type=text] { flex:1 1 260px; min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:15px; }
  select, button { padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.rec { border-color:#c33; color:#c33; }
  label.small { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  #feed { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:13.5px; max-height:70vh; overflow-y:auto; }
  .entry { border-top:1px solid var(--line); padding:10px 2px; }
  .entry:first-child { border-top:none; }
  .ts { color:var(--muted); }
  .route { font-weight:600; }
  .r-NONE { color:var(--none); } .r-HOME_AUTOMATION, .r-MEDIA, .r-TIMERS { color:var(--ok); }
  .r-LLM, .r-LLM_LARGE { color:var(--llm); } .r-CLARIFY, .r-ESCALATE { color:var(--warn); }
  .bar { display:inline-block; height:8px; background:var(--accent); border-radius:4px; vertical-align:middle; margin-right:6px; }
  .scores { color:var(--muted); font-size:12px; margin-top:2px; word-break:break-word; }
  .answer { margin-top:6px; padding:8px 10px; border-left:3px solid var(--llm); background:var(--bg); font-family:system-ui,sans-serif; white-space:pre-wrap; }
  h2 { font-size:14px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .kv { display:flex; justify-content:space-between; font-size:13.5px; padding:2px 0; gap:8px; }
  .kv b { font-weight:600; text-align:right; word-break:break-all; }
  .side .panel { margin-bottom:16px; }
  .on { color:var(--ok); } .off { color:var(--none); }
</style>
</head>
<body>
<header>
  <h1>Decision Lab</h1>
  <span>fala/texto → modelo de decisão → rota → ação | LLM</span>
</header>
<main>
  <section class="panel">
    <div class="controls">
      <input id="text" type="text" placeholder='Ex.: "Alexa, acende a luz da sala"' autocomplete="off">
      <button class="primary" id="send">Enviar</button>
    </div>
    <div class="controls">
      <select id="backend" title="backend de decisão"></select>
      <label class="small">limiar <input id="thr" type="range" min="0" max="0.95" step="0.05" value="0"><span id="thrv">0.00</span></label>
      <select id="low" title="o que fazer com baixa confiança">
        <option value="ignore">baixa confiança → ignorar</option>
        <option value="clarify">baixa confiança → perguntar</option>
      </select>
      <button id="demo">▶ stream de demonstração</button>
      <button id="mic" title="Web Speech API do navegador (prévia da Fase 4)">🎤 microfone</button>
    </div>
    <div id="feed"></div>
  </section>
  <aside class="side">
    <div class="panel"><h2>Casa (simulada)</h2><div id="home"><span class="ts">nenhum dispositivo alterado</span></div></div>
    <div class="panel"><h2>Estatísticas</h2><div id="stats"></div></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const feed = $("feed");
const entries = {};
const DEMO = [
  "Cara, você viu o jogo ontem?", "Alexa, acende a luz da sala", "Gol! Gol do Brasil!",
  "Amor, você lembrou de comprar pão?", "Alexa, bota um timer de 10 minutos",
  "A Alexa da minha tia não entende nada que ela fala", "Alexa, toca uma música do Djavan",
  "Alexa, pesquisa pra mim quais são os melhores filmes de ficção científica", "tá bom, já vou",
  "Alexa, apaga todas as luzes", "Alexandre, vem jantar!", "Alexa, escreve um email pro meu chefe pedindo férias",
];

function fmtT(t) { const m = Math.floor(t / 60), s = (t % 60).toFixed(3).padStart(6, "0"); return `${String(m).padStart(2,"0")}:${s}`; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(ev) {
  const div = document.createElement("div");
  div.className = "entry";
  const conf = ev.confidence == null ? "—" : ev.confidence.toFixed(2);
  const width = ev.confidence == null ? 0 : Math.round(ev.confidence * 80);
  const scores = ev.scores ? Object.entries(ev.scores).sort((a,b)=>b[1]-a[1]).slice(0,4)
      .map(([k,v]) => `${k} ${v.toFixed(2)}`).join(" · ") : "";
  div.innerHTML = `<div class="ts">[${fmtT(ev.t)}] ${esc(ev.backend)} · ${ev.latency_ms.toFixed(0)} ms · ${esc(ev.source||"")}</div>
    <div>Input: “${esc(ev.input)}”</div>
    <div>Decision: <b>${esc(ev.decision.toUpperCase())}</b></div>
    <div>Confidence: <span class="bar" style="width:${width}px"></span>${conf} <span class="ts">(${esc(ev.score_kind)})</span></div>
    <div>Route: <span class="route r-${esc(ev.route)}">${esc(ev.route)}</span> <span class="ts">${esc(ev.route_reason||"")}</span></div>
    ${scores ? `<div class="scores">${esc(scores)}</div>` : ""}`;
  feed.prepend(div);
  entries[ev.id] = div;
}

function renderAnswer(ev) {
  const div = entries[ev.decision_id];
  if (!div) return;
  const a = document.createElement("div");
  a.className = "answer";
  a.textContent = `${ev.llm} (${(ev.llm_latency_ms/1000).toFixed(1)} s): ${ev.answer}`;
  div.appendChild(a);
}

function renderHome(s) {
  const rows = Object.entries(s.devices).map(([k,v]) => `<div class="kv"><span>${esc(k)}</span><b class="${v==="on"?"on":"off"}">${esc(v)}</b></div>`);
  rows.push(`<div class="kv"><span>mídia</span><b>${esc(s.media.playing || "parada")} · vol ${s.media.volume}</b></div>`);
  if (s.timers.length) rows.push(`<div class="kv"><span>timers/lembretes</span><b>${s.timers.length}</b></div>`);
  $("home").innerHTML = rows.join("");
}

async function refreshStats() {
  const s = await (await fetch("/v1/stats")).json();
  const routes = Object.entries(s.routes).map(([k,v]) => `<div class="kv"><span class="r-${esc(k)}">${esc(k)}</span><b>${v}</b></div>`).join("");
  $("stats").innerHTML = `<div class="kv"><span>decisões</span><b>${s.decisions}</b></div>
    <div class="kv"><span>latência média decisão</span><b>${s.mean_decision_ms} ms</b></div>
    <div class="kv"><span>chamadas ao LLM</span><b>${s.llm_calls}</b></div>
    <div class="kv"><span>chamadas ao LLM evitadas</span><b>${s.llm_calls_avoided}</b></div>
    <div class="kv"><span>latência média LLM</span><b>${(s.mean_llm_ms/1000).toFixed(1)} s</b></div>${routes}`;
}

async function send(text, source = "ui") {
  if (!text.trim()) return;
  const body = { input: text, backend: $("backend").value, min_confidence: parseFloat($("thr").value),
                 low_confidence: $("low").value, source };
  const r = await fetch("/v1/route", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  if (!r.ok) alert(await r.text());
}

async function init() {
  const b = await (await fetch("/v1/backends")).json();
  for (const [name, spec] of Object.entries(b.backends)) {
    const o = document.createElement("option");
    o.value = name; o.textContent = `${name}${spec.loaded ? " ●" : ""}`;
    if (name === b.default) o.selected = true;
    $("backend").appendChild(o);
  }
  renderHome(await (await fetch("/v1/state")).json());
  refreshStats();
  const es = new EventSource("/v1/events");
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "decision") { render(ev); refreshStats(); }
    else if (ev.type === "llm_answer") { renderAnswer(ev); refreshStats(); }
    else if (ev.type === "state") renderHome(ev);
  };
}

$("send").onclick = () => { send($("text").value); $("text").value = ""; };
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") $("send").click(); });
$("thr").oninput = () => $("thrv").textContent = parseFloat($("thr").value).toFixed(2);
$("demo").onclick = async () => { for (const t of DEMO) { await send(t, "demo"); } };

// Prévia da Fase 4: reconhecimento de voz contínuo do navegador (Chrome/Edge). O áudio é processado
// pelo serviço de voz do navegador, NÃO localmente; o STT local (whisper.cpp) é um próximo passo.
let rec = null;
$("mic").onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("Este navegador não tem Web Speech API (use Chrome/Edge)."); return; }
  if (rec) { rec.stop(); rec = null; $("mic").classList.remove("rec"); return; }
  rec = new SR(); rec.lang = "pt-BR"; rec.continuous = true; rec.interimResults = false;
  rec.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) send(e.results[i][0].transcript, "voice"); };
  rec.onend = () => { if (rec) rec.start(); };
  rec.start(); $("mic").classList.add("rec");
};
init();
</script>
</body>
</html>
